name: Install Linux Simulator

on:
  push:
    branches: [main]
    paths:
      - ".integration/linux/READY"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct simulator
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/linux/part-* > /tmp/linux.b64
          base64 -d /tmp/linux.b64 > /tmp/linux.zip
          rm -rf /tmp/linux-unpack simulator/linux
          mkdir -p /tmp/linux-unpack simulator/linux
          unzip -q /tmp/linux.zip -d /tmp/linux-unpack
          cp -R /tmp/linux-unpack/linux/. simulator/linux/
          rm -rf .integration/linux
      - name: Commit simulator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install upgraded Linux simulator"
          git push

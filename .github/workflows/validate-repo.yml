name: Validate Simulator Repository

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "player.html"
      - "styles.css"
      - "library.js"
      - "library.css"
      - "app.js"
      - "AI_CAPABILITY_INDEX.json"
      - "lessons.js"
      - "lesson-json/**"
      - "project-data/**"
      - "simulator/**"
      - "scripts/**"
      - ".github/workflows/validate-repo.yml"
      - ".github/workflows/package-simulator.yml"
  pull_request:
    paths:
      - "index.html"
      - "player.html"
      - "styles.css"
      - "library.js"
      - "library.css"
      - "app.js"
      - "lessons.js"
      - "lesson-json/**"
      - "project-data/**"
      - "simulator/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate simulator repository
        run: node scripts/validate-repo.cjs

  intellij-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Exercise the IntelliJ player in Chromium
        run: node scripts/test-intellij-ui.cjs

name: Install Jira Simulator

on:
  push:
    branches: [main]
    paths:
      - ".integration/jira/READY"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Jira simulator
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/jira/part-* > /tmp/jira.b64
          base64 -d /tmp/jira.b64 > /tmp/jira.zip
          rm -rf /tmp/jira-unpack simulator/jira
          mkdir -p /tmp/jira-unpack simulator/jira
          unzip -q /tmp/jira.zip -d /tmp/jira-unpack
          cp -R /tmp/jira-unpack/jira/. simulator/jira/
          rm -rf .integration/jira
      - name: Commit Jira simulator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install upgraded Jira simulator"
          git push

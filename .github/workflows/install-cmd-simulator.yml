name: Install CMD Simulator

on:
  push:
    branches: [main]
    paths:
      - ".integration/cmd/READY"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct simulator
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/cmd/part-* > /tmp/cmd.b64
          base64 -d /tmp/cmd.b64 > /tmp/cmd.zip
          rm -rf /tmp/cmd-unpack simulator/cmd
          mkdir -p /tmp/cmd-unpack simulator/cmd
          unzip -q /tmp/cmd.zip -d /tmp/cmd-unpack
          cp -R /tmp/cmd-unpack/cmd/. simulator/cmd/
          rm -rf .integration/cmd
      - name: Commit simulator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install upgraded Windows CMD simulator"
          git push

name: Package SSMS Simulator

on:
  push:
    branches: [main]
    paths:
      - ".integration/package-ssms/READY"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SSMS package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SSMS-Simulator/simulator/ssms SSMS-Simulator/simulator/shared
          cp simulator/ssms/index.html SSMS-Simulator/simulator/ssms/
          cp simulator/ssms/engine.js SSMS-Simulator/simulator/ssms/
          cp simulator/shared/highlighter.js SSMS-Simulator/simulator/shared/
          cp simulator/shared/explanation-controls.js SSMS-Simulator/simulator/shared/
          cp simulator/shared/layout-resize.js SSMS-Simulator/simulator/shared/
          printf '%s\n' \
            'SQL Server Management Studio Simulator' \
            '=====================================' \
            '' \
            'Main simulator:' \
            '  simulator/ssms/index.html' \
            '  simulator/ssms/engine.js' \
            '' \
            'Shared dependencies:' \
            '  simulator/shared/highlighter.js' \
            '  simulator/shared/explanation-controls.js' \
            '  simulator/shared/layout-resize.js' \
            '' \
            'Keep the relative folder structure intact while editing.' \
            'Send the upgraded ZIP back when finished.' \
            > SSMS-Simulator/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SSMS-Simulator-Upgradable
          path: SSMS-Simulator
          if-no-files-found: error
          retention-days: 7

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Java Practice Developer Playback</title>
  <link rel="stylesheet" href="styles.css?v=24">
</head>
<body>
  <div class="learning-shell" id="learningShell">
    <aside class="progress-sidebar">
      <div class="brand-row">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div><strong>Java Project Playback</strong><small>Developer build simulation</small></div>
      </div>

      <div class="sidebar-tools">
        <label class="search-box">
          <span>⌕</span>
          <input id="stepSearch" placeholder="Search steps...">
        </label>
        <button id="fullCodeBtn" class="full-code-btn" type="button">
          <span class="full-code-icon">◫</span>
          <span>View Full Code</span>
        </button>
      </div>

      <nav id="stageList" class="stage-list" aria-label="Project stages"></nav>
    </aside>

    <main class="workspace">
      <header class="workspace-head">
        <div>
          <div class="head-meta"><div class="eyebrow" id="stageLabel">PROJECT PREVIEW</div><span class="software-badge" id="softwareBadge">IntelliJ IDEA</span></div>
          <h1 id="stepTitle">Java Practice</h1>
        </div>
        <div class="head-actions">
          <button id="toggleSidebar">Hide progress</button>
          <button id="ideFullscreen">IDE fullscreen</button>
        </div>
      </header>

      <section class="ide-shell" id="ideShell">
        <iframe id="ideFrame" class="sim-frame active" data-app="intellij" src="simulator/intellij/index.html?v=11" title="IntelliJ IDEA simulator"></iframe>
        <iframe id="pgadminFrame" class="sim-frame" data-app="pgadmin" src="simulator/pgadmin/index.html?v=11" title="pgAdmin simulator"></iframe>
        <iframe id="vscodeFrame" class="sim-frame" data-app="vscode" src="simulator/vscode/index.html?v=18" title="Visual Studio Code simulator"></iframe>
        <iframe id="postmanFrame" class="sim-frame" data-app="postman" src="simulator/postman/index.html?v=11" title="Postman simulator"></iframe>
        <iframe id="cmdFrame" class="sim-frame" data-app="cmd" src="simulator/cmd/index.html?v=13" title="Windows Command Prompt simulator"></iframe>
        <iframe id="linuxFrame" class="sim-frame" data-app="linux" src="simulator/linux/index.html?v=15" title="Linux workstation simulator"></iframe>
        <iframe id="ssmsFrame" class="sim-frame" data-app="ssms" src="simulator/ssms/index.html?v=13" title="SQL Server Management Studio simulator"></iframe>
        <iframe id="jiraFrame" class="sim-frame" data-app="jira" src="simulator/jira/index.html?v=8" title="Jira simulator"></iframe>
      </section>

      <footer class="playback-bar hidden" id="playbackBar">
        <button id="prevBtn">← Prev</button>
        <button id="replayBtn">↻ Replay step</button>
        <div class="step-meter"><span id="stepCounter">0 / 0</span><div><i id="stepProgress"></i></div></div>
        <button id="nextBtn" class="primary">Next →</button>
      </footer>
    </main>
  </div>

  <script src="project-data/part-01.js?v=1"></script>
  <script src="project-data/part-02.js?v=1"></script>
  <script src="project-data/part-03.js?v=1"></script>
  <script src="project-data/part-04.js?v=1"></script>
  <script src="project-data/part-05.js?v=1"></script>
  <script src="project-data/part-06.js?v=1"></script>
  <script src="project-data/part-07.js?v=1"></script>
  <script src="project-data/part-08.js?v=1"></script>
  <script src="project-data/index.js?v=1"></script>
  <script src="lessons.js?v=25"></script>
  <script src="app.js?v=27"></script>
</body>
</html>

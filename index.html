<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Java Developer Journey Library</title>
  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      if (q.has("step") || q.get("view") === "full") {
        location.replace("player.html" + location.search + location.hash);
      }
    })();
  </script>
  <script>
    window.__LIBRARY_BOOT_TOKEN__=Date.now().toString(36);
    (function(){
      var l=document.createElement("link");
      l.rel="stylesheet";
      l.href="library.css?boot="+encodeURIComponent(window.__LIBRARY_BOOT_TOKEN__);
      document.head.appendChild(l);
    })();
  </script>
</head>
<body>
  <div class="catalog-shell">
    <aside class="catalog-sidebar">
      <div class="sidebar-title">
        <span>Books</span>
        <b id="sidebarBookCount">0</b>
      </div>

      <button class="side-filter active" type="button" data-filter="all">
        <span>All</span><em id="allChapterCount">0</em>
      </button>

      <nav id="bookFilters" class="book-filters" aria-label="Book filters"></nav>

      <div class="sidebar-bottom">
        <a href="player.html?view=full">View Full Code</a>
        <a href="player.html?software=redis">Redis Insight Lab</a>
        <a href="player.html?software=spring_initializer">Spring Initializr Lab</a>
        <a href="player.html?software=maven_central">Maven Central Lab</a>
      </div>
    </aside>

    <main class="catalog-main">
      <header class="catalog-header">
        <div class="title-block">
          <span class="eyebrow">Developer Journey</span>
          <h1>All Books</h1>
        </div>

        <label class="catalog-search">
          <span>⌕</span>
          <input id="catalogSearch" type="search" placeholder="Search books or chapters">
        </label>

        <div class="header-pills">
          <button id="continueBtn" class="pill continue-pill" type="button">Continue</button>
          <span class="pill"><b id="bookCount">0</b> books</span>
          <span class="pill"><b id="chapterCount">0</b> chapters</span>
          <span class="pill"><b id="stepCount">0</b> steps</span>
        </div>
      </header>

      <section class="catalog-content">
        <div id="bookshelf" class="books-grid"></div>
        <div id="emptyState" class="empty-state hidden">No books or chapters match your search.</div>
      </section>
    </main>
  </div>

  <script>
    (function(){
      var boot=window.__LIBRARY_BOOT_TOKEN__||Date.now().toString(36);
      function load(path,done){
        var s=document.createElement("script");
        s.src=path+"?boot="+encodeURIComponent(boot);
        s.onload=done;
        s.onerror=function(){console.error("Library asset failed:",path)};
        document.body.appendChild(s);
      }
      load("lessons.js",function(){load("library.js",function(){})});
    })();
  </script>
</body>
</html>

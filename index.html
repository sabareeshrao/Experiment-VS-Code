<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Task API Developer Playback</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="learning-shell" id="learningShell">
    <aside class="progress-sidebar">
      <div class="brand-row">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div><strong>Java Project Playback</strong><small>Developer build simulation</small></div>
      </div>
      <div class="sidebar-tools">
        <label class="search-box"><span>⌕</span><input id="stepSearch" placeholder="Search steps..."></label>
        <button class="pin-pill" id="pinBtn">⌁ <span>Pinned</span><b id="pinCount">0</b></button>
      </div>
      <nav id="stageList" class="stage-list" aria-label="Project stages"></nav>
    </aside>

    <main class="workspace">
      <header class="workspace-head">
        <div>
          <div class="eyebrow" id="stageLabel">STAGE</div>
          <h1 id="stepTitle">Loading simulator…</h1>
        </div>
        <div class="head-actions">
          <button id="toggleSidebar">Hide progress</button>
          <button id="ideFullscreen">IDE fullscreen</button>
        </div>
      </header>

      <section class="ide-shell" id="ideShell">
        <iframe id="ideFrame" src="simulator/intellij.html" title="IntelliJ IDEA simulator"></iframe>
        <aside class="assistant-card" id="assistantCard">
          <div class="assistant-head"><div class="assistant-avatar">✦</div><div><strong>Step explanation</strong><span id="assistantMeta">Why this code?</span></div></div>
          <div class="assistant-copy" id="assistantCopy">The explanation for the current developer step will appear here.</div>
        </aside>
      </section>

      <footer class="playback-bar">
        <button id="prevBtn">← Prev</button>
        <button id="replayBtn">↻ Replay step</button>
        <div class="step-meter"><span id="stepCounter">0 / 0</span><div><i id="stepProgress"></i></div></div>
        <button id="nextBtn" class="primary">Next →</button>
      </footer>
    </main>
  </div>
  <script src="lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="simulation-app" content="github_actions"><meta name="simulation-label" content="GitHub Actions"><title>GitHub Actions Simulator</title><style>
:root{--bg:#0d1117;--surface:#0d1117;--surface2:#161b22;--surface3:#21262d;--line:#30363d;--text:#c9d1d9;--muted:#8b949e;--link:#58a6ff;--green:#238636;--red:#f85149;--yellow:#d29922;--orange:#f78166;--shadow:rgba(0,0,0,.5);--sideW:260px}body.theme-light{--bg:#fff;--surface:#fff;--surface2:#f6f8fa;--surface3:#f3f4f6;--line:#d0d7de;--text:#24292f;--muted:#57606a;--link:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--orange:#bc4c00;--shadow:rgba(31,35,40,.15)}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr);position:relative}.top{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface2);border-bottom:1px solid var(--line)}.logo{font-weight:800}.repo{color:var(--link)}.grow{flex:1}.main{display:grid;grid-template-columns:var(--sideW) 5px minmax(0,1fr);min-height:0}.side{border-right:1px solid var(--line);padding:12px;overflow:auto}.split{background:var(--line);opacity:.45;cursor:col-resize}.item{padding:7px 8px;border-radius:6px;font-size:12px}.item.active,.item:hover{background:var(--surface2)}.section{font-size:10px;color:var(--muted);padding:12px 8px 4px;text-transform:uppercase}.content{overflow:auto;min-width:0}.tabs{display:flex;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface)}.tab{padding:10px 9px;font-size:12px;border-bottom:2px solid transparent}.tab.active{border-bottom-color:var(--orange)}.view{padding:18px 20px}.card{border:1px solid var(--line);border-radius:6px;margin-bottom:12px;background:var(--surface);overflow:hidden}.head{padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:12px}.row{padding:10px 12px;border-bottom:1px solid var(--surface3);font-size:12px;display:grid;grid-template-columns:minmax(180px,1fr) 150px 100px;gap:8px}.row:last-child{border-bottom:0}.btn{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 10px;font-size:12px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.search{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px}.ok{color:#3fb950}.bad{color:#f85149}.wait{color:#d29922}.muted{color:var(--muted)}.editor{display:grid;grid-template-columns:48px 1fr;border:1px solid var(--line);border-radius:6px;overflow:auto;background:var(--surface)}.gutter,.code{font:12px/20px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;padding:10px}.gutter{background:var(--surface2);color:var(--muted);text-align:right;border-right:1px solid var(--line)}.yamlKey{color:#79c0ff}.yamlStr{color:#a5d6ff}.yamlVal{color:#ffa657}.log{font:12px/18px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;background:#010409;color:#c9d1d9;padding:12px;border-radius:6px;max-height:420px;overflow:auto}.job{border:1px solid var(--line);border-radius:6px;margin-bottom:8px}.jobHead{padding:10px 12px;background:var(--surface2)}.step{padding:7px 12px;border-top:1px solid var(--surface3);font-size:12px}.step summary{cursor:pointer}.templateGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.template{border:1px solid var(--line);border-radius:6px;padding:14px}.pill{display:inline-block;padding:2px 7px;border-radius:10px;background:#1f6feb;color:#fff;font-size:10px}.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px}.modalBack{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:40}.modalBack.show{display:grid}.modal{width:min(680px,92vw);max-height:84vh;overflow:auto;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:16px}.target{position:absolute;display:none;pointer-events:none;border:2px solid #58a6ff;border-radius:4px;box-shadow:0 0 0 2px rgba(88,166,255,.18);z-index:90}.target.show{display:block}.contextMenu{position:fixed;z-index:120;display:none;min-width:230px;padding:4px;background:var(--surface2);border:1px solid var(--line);box-shadow:0 8px 24px var(--shadow)}.contextMenu.show{display:block}.contextItem{padding:6px 8px;font-size:11px}.contextItem:hover{background:var(--surface3)}.productAssistant{position:fixed;right:16px;bottom:38px;width:340px;z-index:150;display:none;background:var(--surface2);border:1px solid var(--line);box-shadow:0 8px 24px var(--shadow);border-radius:6px;overflow:hidden}.productAssistant.show{display:block}.productAssistantHead{height:34px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--surface3);border-bottom:1px solid var(--line);font-size:10px;font-weight:700}.productAssistantHead .grow{flex:1}.productAssistantHead button{border:0;background:transparent;color:inherit;width:24px;height:24px}.productAssistantBody{padding:10px;font-size:10.5px;line-height:1.5;max-height:210px;overflow:auto;user-select:text}@media(max-width:800px){.main{grid-template-columns:210px 4px minmax(0,1fr)}.two{grid-template-columns:1fr}.side{padding:8px}}
</style></head><body class="theme-dark" data-sim-app="github_actions"><div class="app" id="app"><div class="top"><div class="logo">GitHub</div><span class="repo" id="repoName">owner/repository</span><div class="grow"></div><button class="btn" id="themeBtn">◐</button><span>Actions</span><span>⚙</span></div><div class="main"><aside class="side"><div class="item active" data-nav="actions">Actions</div><div class="item" data-nav="runs">All workflows</div><div class="item" data-nav="new">New workflow</div><div class="section">Management</div><div class="item" data-nav="caches">Caches</div><div class="item" data-nav="artifacts">Artifacts</div><div class="item" data-nav="environments">Environments</div><div class="item" data-nav="runners">Runners</div><div class="item" data-nav="secrets">Secrets and variables</div><div class="item" data-nav="marketplace">Marketplace</div></aside><div class="split" id="sideSplit"></div><main class="content" id="content"></main></div><div class="modalBack" id="modalBack"><div class="modal" id="modal"></div></div><div class="target" id="target"></div><div class="contextMenu" id="contextMenu"></div><aside class="productAssistant" data-sim-explanation id="assistant"><div class="productAssistantHead" data-sim-explanation-drag><strong>GitHub Actions</strong><span class="grow"></span><button id="assistantMin" title="Minimize">−</button><button id="assistantClose" title="Close">×</button></div><div class="productAssistantBody" data-sim-explanation-body><div data-sim-explanation-text id="assistantText"></div></div></aside></div><script src="../shared/explanation-controls.js?v=23"></script>

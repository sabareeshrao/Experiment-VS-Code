<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="simulation-app" content="cmd">
<meta name="simulation-label" content="Windows Command Prompt">
<title>Windows Command Prompt Playback Engine</title>
<style>
:root{--chrome:#202020;--chrome2:#2b2b2b;--line:#3c3c3c;--fg:#f2f2f2;--muted:#aaa;--accent:#ffd400}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#111;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif}
button,input{font:inherit}.window{position:relative;height:100%;display:grid;grid-template-rows:31px 25px minmax(0,1fr) 23px;border:1px solid #4a4a4a;background:#000;color:var(--fg)}
.titlebar{display:flex;align-items:center;background:#202020;color:#f5f5f5;font-size:11px;padding-left:8px;border-bottom:1px solid #3a3a3a;user-select:none}.icon{width:16px;height:16px;background:#050505;border:1px solid #555;color:#fff;display:grid;place-items:center;font:8px Consolas;margin-right:7px}.winTitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{margin-left:auto;display:flex;height:100%}.controls button{width:46px;border:0;background:transparent;color:#ddd;display:grid;place-items:center;font-size:12px}.controls button:hover{background:#3a3a3a}.controls .close:hover{background:#c42b1c;color:#fff}
.menu{position:relative;display:flex;align-items:center;background:#202020;color:#eee;font-size:10px;border-bottom:1px solid #3b3b3b}.menu button{border:0;background:transparent;color:inherit;padding:5px 9px}.menu button:hover{background:#343434}.menuPopup{position:absolute;left:0;top:25px;z-index:160;display:none;min-width:160px;background:#252525;border:1px solid #555;box-shadow:0 6px 20px rgba(0,0,0,.45);padding:4px}.menuPopup.show{display:block}.menuPopup div{padding:6px 8px;font-size:10px}.menuPopup div:hover{background:#3b3b3b}
.terminalWrap{position:relative;overflow:auto;background:#000;outline:none}.terminal{min-height:100%;padding:6px 8px 34px;color:#eee;white-space:pre-wrap;word-break:break-word;font:14px/19px Consolas,"Courier New",monospace}.line{min-height:19px}.promptLine{display:flex;align-items:flex-start;min-width:0}.prompt{white-space:pre;flex:none}.command{white-space:pre-wrap;min-width:0}.cmdInput{flex:1;min-width:12px;border:0;outline:0;background:transparent;color:#eee;font:inherit;line-height:19px;padding:0;margin:0;caret-color:#eee}.cmdInput::selection,.terminal ::selection{background:#c8c8c8;color:#000}.focusLine{background:#242424;outline:1px solid #555}.match{background:#665700;color:#fff}.errorText{color:#ff8080}.mutedText{color:#aaa}
.statusbar{display:flex;align-items:center;gap:14px;padding:0 8px;background:#202020;border-top:1px solid #3b3b3b;color:#bcbcbc;font-size:9px}.statusbar .grow{flex:1}.statusbar span{white-space:nowrap}.statusFlash{position:absolute;right:10px;top:64px;z-index:140;background:#282828;color:#fff;border:1px solid #666;padding:5px 8px;font:10px "Segoe UI";display:none;box-shadow:0 4px 16px rgba(0,0,0,.45)}.statusFlash.show{display:block}
.targetBoundary{position:absolute;z-index:120;display:none;pointer-events:none;border:3px solid #ffd400;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.85),0 0 12px rgba(255,212,0,.75);transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease}.targetBoundary.show{display:block}
.cmdAssistant{position:absolute;right:18px;bottom:39px;width:min(370px,44vw);z-index:180;background:#242424;color:#eee;border:1px solid #666;border-radius:6px;box-shadow:0 12px 38px rgba(0,0,0,.5);display:none;overflow:hidden}.cmdAssistant.show{display:block}.assistantHead{height:34px;display:flex;align-items:center;padding:0 8px;background:#303030;border-bottom:1px solid #4a4a4a;font-size:10px;font-weight:700;cursor:move}.assistantHead .grow{flex:1}.assistantHead button{border:0;background:transparent;color:#ddd;width:26px;height:26px;font-size:15px}.assistantBody{padding:10px;font:10px/16px "Segoe UI",Arial,sans-serif;max-height:220px;overflow:auto}.assistantMeta{color:#f2b84b;font-size:9px;margin-bottom:5px}.cmdAssistant.minimized .assistantBody{display:none}
.modalShade{position:absolute;inset:0;z-index:200;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center}.modalShade.show{display:flex}.modal{width:min(560px,88vw);max-height:75vh;background:#252525;border:1px solid #666;border-radius:5px;box-shadow:0 14px 44px rgba(0,0,0,.55);overflow:hidden}.modalHead{height:35px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #444;font-size:11px;font-weight:700}.modalHead .grow{flex:1}.modalHead button{border:0;background:transparent;color:#ddd;font-size:18px}.modalBody{padding:12px;font-size:10px;line-height:16px;overflow:auto;max-height:60vh}.propGrid{display:grid;grid-template-columns:150px 1fr;gap:6px 10px}.propGrid label{color:#bbb}.propGrid input,.propGrid select{background:#161616;color:#eee;border:1px solid #555;border-radius:3px;padding:4px 6px;font-size:10px}
.window.maximized{border:0}.window.minimized .menu,.window.minimized .terminalWrap,.window.minimized .statusbar{display:none}.window.minimized{height:31px}.window.closed{opacity:.55}.window.closed .terminalWrap{filter:blur(1px)}
@media(max-width:700px){.terminal{font-size:11px;line-height:16px}.controls button{width:34px}.cmdAssistant{left:8px;right:8px;width:auto}.statusbar{gap:7px}}
</style>
</head>
<body class="theme-dark" data-sim-app="cmd">
<div class="window" id="window">
  <div class="titlebar" id="titlebar"><div class="icon">C:\</div><div class="winTitle" id="winTitle">Command Prompt</div><div class="controls"><button id="minBtn" title="Minimize">—</button><button id="maxBtn" title="Maximize">□</button><button id="closeBtn" class="close" title="Close">×</button></div></div>
  <div class="menu" id="menu"><button data-menu="File">File</button><button data-menu="Edit">Edit</button><button data-menu="Defaults">Defaults</button><button data-menu="Properties">Properties</button><div class="menuPopup" id="menuPopup"></div></div>
  <div class="terminalWrap" id="terminalWrap" tabindex="0"><div class="terminal" id="terminal"></div></div>
  <div class="statusbar"><span id="cwdStatus">C:\</span><span id="errorStatus">ERRORLEVEL 0</span><span class="grow"></span><span id="processStatus">Ready</span><span>Windows Command Processor</span></div>
  <div class="statusFlash" id="statusFlash"></div><div class="targetBoundary" id="targetBoundary"></div>
  <div class="cmdAssistant" id="cmdAssistant"><div class="assistantHead" id="assistantHead"><span id="assistantTitle">Current Step</span><span class="grow"></span><button id="assistantMin">—</button><button id="assistantClose">×</button></div><div class="assistantBody"><div class="assistantMeta" id="assistantMeta">Telugu (Romanized)</div><div id="assistantText"></div></div></div>
  <div class="modalShade" id="modalShade"><div class="modal"><div class="modalHead"><span id="modalTitle">Command Prompt Properties</span><span class="grow"></span><button id="modalClose">×</button></div><div class="modalBody" id="modalBody"></div></div></div>
</div>
<script src="engine.js?v=4"></script>
<script src="adaptive-ui.js?v=1"></script>
  <script src="../shared/highlighter.js?v=7"></script>\n  <script src="../shared/explanation-controls.js?v=9"></script>  <script src="../shared/layout-resize.js?v=6"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Studio Code Simulator</title>
<style>
:root{--bg:#181818;--editor:#1f1f1f;--line:#2b2b2b;--text:#ccc;--muted:#858585;--blue:#0078d4;--select:#04395e;--hover:#2a2d2e}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#424242 transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#424242;border:2px solid transparent;background-clip:padding-box;border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:#555;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-corner{background:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif}
button{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:35px minmax(0,1fr) 22px}.titlebar{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:0 9px;font-size:11px}.logo{width:21px;color:#23a8f2;font-size:17px;font-weight:900}.menus{display:flex;gap:14px}.command{margin:auto;width:min(480px,48vw);height:24px;border:1px solid #3a3a3a;border-radius:6px;background:#242424;display:flex;align-items:center;justify-content:center;color:#aaa}.window{letter-spacing:10px;color:#aaa}
.workbench{min-height:0;display:grid;grid-template-columns:48px 245px minmax(0,1fr)}.activity{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center}.act{width:48px;height:48px;border:0;background:transparent;color:#8d8d8d;font-size:18px}.act.active{color:#fff;border-left:2px solid #fff}.act:hover{color:#fff}.activity .bottom{margin-top:auto}.sidebar{min-width:0;border-right:1px solid var(--line);display:grid;grid-template-rows:35px minmax(0,1fr)}.sideTitle{display:flex;align-items:center;padding:0 14px;font-size:10px;text-transform:uppercase;letter-spacing:.06em}.tree{overflow:auto;padding:4px 0;font-size:11px}.row{height:23px;display:flex;align-items:center;gap:4px;padding-right:6px;white-space:nowrap}.row:hover{background:var(--hover)}.row.active{background:var(--select)}.tw{width:15px;text-align:center;color:#9b9b9b}.ico{width:17px;text-align:center}.name{overflow:hidden;text-overflow:ellipsis}
.center{min-width:0;min-height:0;display:grid;grid-template-rows:35px 25px minmax(0,1fr) 190px;background:var(--editor)}.tabs{display:flex;background:#181818;border-bottom:1px solid var(--line)}.tab{min-width:120px;padding:9px 12px 0;border-right:1px solid var(--line);font-size:11px;color:#aaa}.tab.active{background:var(--editor);color:#fff;border-top:1px solid var(--blue)}.bread{padding:5px 12px;color:#999;font-size:10px;border-bottom:1px solid var(--line)}.editor{min-height:0;display:grid;grid-template-columns:48px minmax(0,1fr);overflow:auto}.gutter{padding:10px 8px 40px 0;text-align:right;color:#6e7681;font:11px/21px Consolas,monospace}.code{margin:0;padding:10px 18px 40px 8px;white-space:pre;min-width:max-content;font:12px/21px Consolas,monospace}.line{display:block;min-height:21px}.line.focus{background:rgba(0,120,212,.12)}.kw{color:#c586c0}.str{color:#ce9178}.num{color:#b5cea8}.com{color:#6a9955}
.panel{border-top:1px solid var(--line);display:grid;grid-template-rows:34px minmax(0,1fr)}.panelTabs{display:flex;gap:18px;padding:0 12px;font-size:10px}.panelTab{height:34px;padding-top:11px;color:#999}.panelTab.active{color:#fff;border-bottom:1px solid #fff}.terminal{overflow:auto;padding:9px 13px;font:11px/18px Consolas,monospace;white-space:pre-wrap}.status{display:flex;align-items:center;gap:11px;border-top:1px solid #2b2b2b;padding:0 8px;font-size:9px;color:#aaa}.status .grow{flex:1}.status .blue{background:#007acc;color:#fff;margin-left:-8px;height:21px;padding:5px 8px}
.assistant{position:absolute;z-index:400;right:16px;bottom:35px;width:315px;max-width:calc(100vw - 30px);background:#252526;border:1px solid #454545;border-radius:6px;box-shadow:0 12px 32px #0008;overflow:hidden;user-select:none;touch-action:none}.assistant.hidden{display:none}.aHead{height:34px;display:flex;align-items:center;gap:7px;padding:0 7px;background:#202020;border-bottom:1px solid #3c3c3c;cursor:grab}.aIcon{width:20px;height:20px;display:grid;place-items:center;border-radius:4px;background:#0e639c;color:#fff;font-size:9px;font-weight:800}.aTitles{flex:1;min-width:0}.aTitles strong,.aTitles span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.aTitles strong{font-size:10px}.aTitles span{font-size:8.5px;color:#999}.aBtn{width:23px;height:23px;border:0;background:transparent;color:#aaa;border-radius:3px}.aBody{padding:9px 10px 11px;font:10.5px/1.55 "Segoe UI",Arial,sans-serif;cursor:grab}.tag{display:inline-block;padding:2px 6px;border-radius:3px;background:#15364d;color:#9cdcfe;font-size:9px;margin-bottom:7px}.lang{font-size:8px;color:#75beff;margin-left:5px}.aBody p{margin:0}.assistant.min .aBody{display:none}.assistant.min{width:225px}
@media(max-width:850px){.workbench{grid-template-columns:42px 190px minmax(0,1fr)}.activity,.act{width:42px}.command{width:40vw}}@media(max-width:620px){.workbench{grid-template-columns:40px 0 minmax(0,1fr)}.sidebar{display:none}.menus{display:none}.command{width:60vw}}
</style></head><body>
<div class="app"><div class="titlebar"><span class="logo">◈</span><span class="menus"><span>File</span><span>Edit</span><span>Selection</span><span>View</span><span>Go</span><span>Run</span><span>Terminal</span><span>Help</span></span><div class="command">⌕ &nbsp; Java Practice</div><span class="window">— □ ×</span></div>
<div class="workbench"><aside class="activity"><button class="act active" title="Explorer">▱</button><button class="act">⌕</button><button class="act">⑂</button><button class="act">▷</button><button class="act">▦</button><button class="act bottom">◎</button><button class="act">⚙</button></aside><aside class="sidebar"><div class="sideTitle">Explorer</div><div class="tree" id="tree"></div></aside><main class="center"><div class="tabs"><div class="tab active" id="tab">Welcome</div></div><div class="bread" id="bread">Java Practice</div><div class="editor" id="editor"><div class="gutter" id="gutter"></div><pre class="code" id="code"></pre></div><section class="panel"><div class="panelTabs"><span class="panelTab">PROBLEMS</span><span class="panelTab">OUTPUT</span><span class="panelTab active">TERMINAL</span><span class="panelTab">DEBUG CONSOLE</span></div><div class="terminal" id="terminal">PS Java Practice&gt; </div></section></main></div>
<div class="status"><span class="blue">⑂ main</span><span>○ 0</span><span>△ 0</span><span class="grow"></span><span id="position">Ln 1, Col 1</span><span>Spaces: 4</span><span>UTF-8</span><span>{ }</span></div></div>
<div class="assistant hidden" id="assistant"><div class="aHead" id="aHead"><div class="aIcon">AI</div><div class="aTitles"><strong id="aTitle">Step explanation</strong><span id="aStage">Developer guidance</span></div><button class="aBtn" id="aMin">—</button><button class="aBtn" id="aClose">×</button></div><div class="aBody"><span class="tag" id="aStep">Step</span><span class="lang">Telugu • English letters</span><p id="aText"></p></div></div>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),clone=v=>JSON.parse(JSON.stringify(v??null)),esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");const R={tree:$("tree"),tab:$("tab"),bread:$("bread"),gutter:$("gutter"),code:$("code"),editor:$("editor"),terminal:$("terminal"),assistant:$("assistant"),aHead:$("aHead"),aTitle:$("aTitle"),aStage:$("aStage"),aStep:$("aStep"),aText:$("aText")};let baseline={},state={},files={},activeFile=null,changed=[],seekToken=0;
function normalize(){state=state||{};files=clone(state.files||{});for(const[p,v]of Object.entries(files))if(typeof v==="string")files[p]={content:v};activeFile=state.initialFile||Object.keys(files)[0]||null}
function syntax(line){let e=esc(line);if(/^\s*\/\//.test(line))return'<span class="com">'+e+'</span>';return e.replace(/\b(class|public|private|protected|const|let|var|function|return|if|else|for|while|import|from|export|new|async|await|interface|type)\b/g,'<span class="kw">$1</span>').replace(/("[^"]*"|'[^']*')/g,'<span class="str">$1</span>').replace(/\b(\d+)\b/g,'<span class="num">$1</span>')}
function rows(){const paths=Object.keys(files).sort(),folders=new Set();for(const p of paths){const a=p.split("/");for(let i=1;i<a.length;i++)folders.add(a.slice(0,i).join("/"))}return[...[...folders].map(p=>({p,folder:true,d:p.split("/").length-1})),...paths.map(p=>({p,folder:false,d:p.split("/").length-1}))].sort((a,b)=>a.p.localeCompare(b.p))}
function renderTree(){R.tree.innerHTML="";for(const x of rows()){const row=document.createElement("div");row.className="row"+(!x.folder&&x.p===activeFile?" active":"");row.style.paddingLeft=(7+x.d*12)+"px";const n=x.p.split("/").pop();row.innerHTML='<span class="tw">'+(x.folder?"⌄":"")+'</span><span class="ico">'+(x.folder?"▰":/\.java$/.test(n)?"J":/\.(js|ts|tsx)$/.test(n)?"JS":"·")+'</span><span class="name">'+esc(n)+'</span>';if(!x.folder)row.onclick=()=>{activeFile=x.p;changed=[];renderAll()};R.tree.appendChild(row)}}
function renderCode(){const content=activeFile&&files[activeFile]?files[activeFile].content||"":"";const lines=String(content).split("\n");R.gutter.innerHTML="";R.code.innerHTML="";lines.forEach((line,i)=>{const g=document.createElement("div");g.textContent=i+1;R.gutter.appendChild(g);const s=document.createElement("span");s.className="line"+(changed.includes(i+1)&&line.trim()?" focus":"");s.innerHTML=syntax(line);R.code.appendChild(s)});R.tab.textContent=activeFile?activeFile.split("/").pop():"Welcome";R.bread.textContent=activeFile?"Java Practice  ›  "+activeFile.split("/").join("  ›  "):"Java Practice";R.editor.scrollTop=R.editor.scrollHeight}
function renderAll(){renderTree();renderCode();R.terminal.textContent=state.terminal||"PS Java Practice> "}function reset(){state=clone(baseline||{});normalize();changed=[];renderAll()}function ensureFile(p){if(!files[p])files[p]={content:""};state.files=files;activeFile=p}
async function apply(step,animate,token){const d=step?.data||{};switch(step?.action){case"openFile":activeFile=d.file||d.path||activeFile;break;case"createFile":ensureFile(d.file||d.path);files[activeFile].content=String(d.content||"");break;case"setFile":ensureFile(d.file||d.path);files[activeFile].content=String(d.content||d.code||"");break;case"typeCode":{const p=d.file||d.path||activeFile;ensureFile(p);const old=files[p].content||"",add=String(d.code||d.text||""),baseLines=old.split("\n").length;let next=old+add;changed=add.split("\n").map((x,i)=>x.trim()?baseLines+i:null).filter(Boolean);if(d.marker&&old.includes(d.marker)){const ls=old.split("\n"),idx=ls.findIndex(x=>x.includes(d.marker)),indent=(ls[idx].match(/^\s*/)||[""])[0],block=add.split("\n").map(x=>indent+x);if(d.position==="before")ls.splice(idx,0,...block);else if(d.position==="after")ls.splice(idx+1,0,...block);else ls.splice(idx,1,...block);next=ls.join("\n");changed=block.map((x,i)=>x.trim()?idx+1+i:null).filter(Boolean)}if(animate&&add.length<500){let built="";for(const ch of add){if(token!==seekToken)return;built+=ch;files[p].content=old+built;renderCode();await new Promise(r=>setTimeout(r,10))}}files[p].content=next;break}case"terminalCommand":case"runTerminal":state.terminal=(state.terminal||"PS Java Practice> ")+String(d.command||"")+(d.output!==undefined?"\n"+d.output:"")+"\nPS Java Practice> ";break;case"setTerminal":state.terminal=String(d.text||d.output||"");break;case"newProject":state.workspaceName=d.name||state.workspaceName||"Java Practice";break;case"createDirectory":case"createPackage":break}state.files=files;renderAll()}
async function seek(steps,animateFinal){const token=++seekToken;reset();for(let i=0;i<steps.length;i++){await apply(steps[i],animateFinal&&i===steps.length-1,token);if(token!==seekToken)return}}
function explain(m){R.aTitle.textContent=m.title||"Step explanation";R.aStage.textContent=m.stage||"Developer guidance";R.aStep.textContent="Step "+(m.step||"");R.aText.textContent=m.text||"";R.assistant.classList.remove("hidden")}
let drag=null;R.aHead.onpointerdown=e=>{if(e.target.closest("button"))return;const r=R.assistant.getBoundingClientRect();drag={id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top};R.assistant.setPointerCapture?.(e.pointerId)};document.onpointermove=e=>{if(!drag||e.pointerId!==drag.id)return;const w=R.assistant.offsetWidth,h=R.assistant.offsetHeight;R.assistant.style.left=Math.max(6,Math.min(innerWidth-w-6,e.clientX-drag.dx))+"px";R.assistant.style.top=Math.max(6,Math.min(innerHeight-h-6,e.clientY-drag.dy))+"px";R.assistant.style.right="auto";R.assistant.style.bottom="auto"};document.onpointerup=e=>{if(drag&&e.pointerId===drag.id)drag=null};$("aMin").onclick=()=>R.assistant.classList.toggle("min");$("aClose").onclick=()=>R.assistant.classList.add("hidden");
window.addEventListener("message",e=>{const m=e.data||{};if(m.type==="SIM_PACKAGE"){baseline=clone(m.package?.apps?.vscode||{});reset()}if(m.type==="SIM_SEEK")seek(Array.isArray(m.steps)?m.steps:[],!!m.animateFinal);if(m.type==="SIM_EXPLAIN")explain(m)});baseline={workspaceName:"Java Practice",files:{},terminal:"PS Java Practice> "};reset();parent.postMessage({type:"ENGINE_READY",app:"vscode"},"*")})();
</script></body></html>

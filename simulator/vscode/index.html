<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Studio Code Simulator</title>
<link rel="stylesheet" href="vscode.css?v=2">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="vscodeMark" aria-label="VS Code">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#23a8f2" d="M17.8 2.7 9.8 9.2 5.7 6.1 2.8 8.4l4.1 3.6-4.1 3.6 2.9 2.3 4.1-3.1 8 6.5 3.4-1.6V4.3l-3.4-1.6Zm-.3 5.2v8.2L12.8 12l4.7-4.1Z"/></svg>
    </div>
    <nav class="menus">
      <span class="menuItem">File</span><span class="menuItem">Edit</span><span class="menuItem">Selection</span><span class="menuItem">View</span><span class="menuItem">Go</span><span class="menuItem">Run</span><span class="menuItem">Terminal</span><span class="menuItem">Help</span>
    </nav>
    <div class="titleCenter">
      <button class="navBtn" title="Back"><svg viewBox="0 0 16 16"><path d="M10.5 3 5.5 8l5 5" stroke="currentColor" fill="none" stroke-width="1.3"/></svg></button>
      <button class="navBtn" title="Forward"><svg viewBox="0 0 16 16"><path d="m5.5 3 5 5-5 5" stroke="currentColor" fill="none" stroke-width="1.3"/></svg></button>
      <div class="commandCenter"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" stroke="currentColor" fill="none"/><path d="m10.5 10.5 3 3" stroke="currentColor"/></svg><span id="commandLabel">Java Practice</span></div>
    </div>
    <div class="windowBtns"><button class="winBtn">—</button><button class="winBtn">□</button><button class="winBtn close">×</button></div>
  </header>

  <div class="workbench">
    <aside class="activityBar">
      <button class="activityBtn active" title="Explorer"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4"/><path d="M3 7v14h12"/></svg></button>
      <button class="activityBtn" title="Search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="5.5"/><path d="m14.5 14.5 5 5"/></svg></button>
      <button class="activityBtn" title="Source Control"><svg viewBox="0 0 24 24"><circle cx="7" cy="5" r="2"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="8" r="2"/><path d="M7 7v10M9 16c5 0 8-2 8-6"/></svg></button>
      <button class="activityBtn" title="Run and Debug"><svg viewBox="0 0 24 24"><path d="m7 4 11 8-11 8z"/><circle cx="17" cy="6" r="2.5"/></svg></button>
      <button class="activityBtn" title="Extensions"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M17 13v8M13 17h8"/></svg></button>
      <div class="activitySpacer"></div>
      <button class="activityBtn" title="Accounts"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c1-4 3.5-6 7-6s6 2 7 6"/></svg></button>
      <button class="activityBtn" title="Manage"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
    </aside>

    <aside class="sidebar">
      <div class="sidebarHead">
        <strong>Explorer</strong>
        <div class="sidebarActions">
          <button class="iconBtn" id="newFileBtn" title="New File"><svg viewBox="0 0 16 16"><path d="M3 1.5h6l3 3V14H3z"/><path d="M9 1.5V5h3M12.5 9v5M10 11.5h5"/></svg></button>
          <button class="iconBtn" id="newFolderBtn" title="New Folder"><svg viewBox="0 0 16 16"><path d="M1.5 4h5l1.5 1.5h6.5V14h-13z"/><path d="M11.5 8.5v4M9.5 10.5h4"/></svg></button>
          <button class="iconBtn" id="refreshBtn" title="Refresh Explorer"><svg viewBox="0 0 16 16"><path d="M13.5 5.5A5.5 5.5 0 1 0 14 9"/><path d="M10.5 5.5h3v-3"/></svg></button>
          <button class="iconBtn" id="collapseBtn" title="Collapse Folders"><svg viewBox="0 0 16 16"><path d="M4 5h8M4 8h8M4 11h8"/><path d="m2 4 1.5 1.5L2 7M14 9l-1.5 1.5L14 12"/></svg></button>
          <button class="iconBtn" title="More Actions"><svg viewBox="0 0 16 16"><circle cx="3" cy="8" r=".8" fill="currentColor"/><circle cx="8" cy="8" r=".8" fill="currentColor"/><circle cx="13" cy="8" r=".8" fill="currentColor"/></svg></button>
        </div>
      </div>
      <div class="tree" id="tree"></div>
    </aside>

    <main class="editorGroup" id="editorGroup">
      <div class="tabsRow">
        <div class="tabs" id="tabs"></div>
        <div class="editorActions">
          <button class="iconBtn markdownPreviewBtn hidden" id="markdownPreviewBtn" title="Open Preview to the Side (Ctrl+Shift+V)">
            <svg viewBox="0 0 16 16"><path d="M2 2.5h8v11H2z"/><path d="M11.5 4.5h2.5v7h-2.5"/><path d="m5 6 2 2-2 2"/></svg>
          </button>
        </div>
      </div>
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <section class="editorArea" id="editorArea">
        <div class="codeViewport" id="codeViewport"><div class="codeTable" id="codeTable"></div></div>
        <aside class="minimap" id="minimap"></aside>
        <article class="markdownPreview hidden" id="markdownPreview">
          <div class="markdownPreviewHead"><span id="markdownPreviewTitle">Preview</span><button class="iconBtn" id="markdownPreviewClose" title="Close Preview">×</button></div>
          <div class="markdownPreviewBody" id="markdownPreviewBody"></div>
        </article>
      </section>
      <section class="panel">
        <div class="panelHead">
          <div class="panelTabs"><button class="panelTab">PROBLEMS</button><button class="panelTab">OUTPUT</button><button class="panelTab active">TERMINAL</button><button class="panelTab">DEBUG CONSOLE</button></div>
          <div class="panelActions"><button class="iconBtn" id="panelCollapse" title="Toggle Panel"><svg viewBox="0 0 16 16"><path d="m4 10 4-4 4 4"/></svg></button><button class="iconBtn" id="panelClose" title="Close Panel">×</button></div>
        </div>
        <div class="panelBody"><div class="terminal" id="terminal"></div></div>
      </section>
    </main>
  </div>

  <footer class="statusbar">
    <span class="statusItem statusAccent"><svg viewBox="0 0 16 16"><circle cx="4" cy="4" r="2"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="6" r="2"/><path d="M4 6v4M6 10c4 0 6-1 6-2"/></svg><span id="branchLabel">main</span></span>
    <span class="statusItem">○ 0</span><span class="statusItem">△ 0</span>
    <span class="statusSpacer"></span>
    <span class="statusItem" id="positionLabel">Ln 1, Col 1</span>
    <span class="statusItem">Spaces: 4</span><span class="statusItem">UTF-8</span><span class="statusItem">LF</span><span class="statusItem" id="languageLabel">Plain Text</span>
  </footer>
</div>

<div class="contextMenu hidden" id="contextMenu">
  <div class="ctxItem" data-action="open">Open</div>
  <div class="ctxItem" data-action="pin">Open Permanently</div>
  <div class="ctxSep"></div>
  <div class="ctxItem" data-action="copy">Copy Path</div>
  <div class="ctxItem" data-action="close">Close</div>
</div>

<div class="assistant hidden" id="assistant">
  <div class="assistantHead" id="assistantHead">
    <div class="assistantIcon">AI</div>
    <div class="assistantTitles"><strong id="assistantTitle">Step explanation</strong><span id="assistantStage">Developer guidance</span></div>
    <button class="assistantBtn" id="assistantMin">—</button><button class="assistantBtn" id="assistantClose">×</button>
  </div>
  <div class="assistantBody"><span class="assistantTag" id="assistantStep">Step</span><span class="assistantLang">Telugu • English letters</span><p id="assistantText"></p></div>
</div>

<script src="engine.js?v=2"></script>
  <script src="../shared/highlighter.js?v=2"></script></body>
</html>

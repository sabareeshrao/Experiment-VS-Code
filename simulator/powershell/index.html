<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows PowerShell Simulator</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#012456;color:#eee;font-family:Consolas,monospace;overflow:hidden}.title{height:32px;background:#f3f3f3;color:#111;font:12px Segoe UI,Arial;padding:7px 10px}.bar{height:34px;background:#0b326d;border-bottom:1px solid #31598f;padding:5px 9px}button{background:#174b87;color:#fff;border:1px solid #4d78aa;padding:4px 8px}.term{height:calc(100% - 114px);overflow:auto;padding:12px;font:14px/1.45 Consolas,monospace;white-space:pre-wrap}.prompt{height:24px;display:flex;gap:8px;align-items:center;padding:0 10px}.prompt span{white-space:nowrap}input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:14px Consolas}.status{height:24px;background:#0b326d;padding:4px 10px;font-size:11px}.exit{float:right}</style></head><body><div class="title">Windows PowerShell</div><div class="bar"><button id="clearBtn">Clear</button><span id="cwdLabel" style="margin-left:12px;font:12px Segoe UI">C:\Java-Experience</span><span id="exitBadge" class="exit">ExitCode: 0</span></div><div id="terminal" class="term"></div><div class="prompt"><span id="promptLabel">PS C:\Java-Experience&gt;</span><input id="commandInput" autocomplete="off"></div><div class="status">Windows PowerShell · Java developer workstation</div>
<script>
(()=>{"use strict";const APP_ID="powershell";const SUPPORTED_ACTIONS=["setCwd","runCommand","showOutput","clearTerminal","setEnv","showExitCode","showDialog","highlightTarget"];const $=id=>document.getElementById(id),refs={term:$("terminal"),input:$("commandInput"),prompt:$("promptLabel"),cwd:$("cwdLabel"),exit:$("exitBadge"),clear:$("clearBtn")};let baseline=null,state=null,seekToken=0;const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));function defaults(){return{cwd:"C:\\Java-Experience",history:[],output:"",exitCode:0,env:{}}}function normalize(v){return Object.assign(defaults(),clone(v||{}),{env:Object.assign({},v?.env||{})})}function render(){refs.cwd.textContent=state.cwd;refs.prompt.textContent="PS "+state.cwd+">";refs.exit.textContent="ExitCode: "+state.exitCode;const lines=[];(state.history||[]).forEach(h=>{lines.push("PS "+(h.cwd||state.cwd)+"> "+h.command);if(h.output)lines.push(h.output)});if(state.output)lines.push(state.output);refs.term.textContent=lines.join("\n");refs.term.scrollTop=refs.term.scrollHeight}function apply(st){const a=st?.action,d=st?.data||{};switch(a){case"setCwd":state.cwd=d.cwd||d.path||state.cwd;break;case"runCommand":state.history.push({cwd:state.cwd,command:d.command||"",output:d.output||""});state.exitCode=Number.isFinite(d.exitCode)?d.exitCode:0;break;case"showOutput":state.output=d.output||d.text||"";break;case"clearTerminal":state.history=[];state.output="";break;case"setEnv":if(d.name)state.env[d.name]=d.value||"";break;case"showExitCode":state.exitCode=Number(d.code??d.exitCode??state.exitCode);break;case"showDialog":state.output=(d.title?d.title+"\n":"")+(d.message||"");break;}render()}function reset(){state=normalize(baseline);render()}function announce(){parent.postMessage({type:"ENGINE_READY",app:APP_ID,actions:SUPPORTED_ACTIONS},"*")}addEventListener("message",e=>{const m=e.data||{};if(m.type==="SIM_PACKAGE"){baseline=clone(m.package?.apps?.powershell||{});reset();return}if(m.type==="SIM_SEEK"){const t=++seekToken;reset();for(const st of m.steps||[]){if(t!==seekToken)return;apply(st)}parent.postMessage({type:"SIM_SEEK_DONE",app:APP_ID},"*");return}if(m.type==="SIM_PING"||m.type==="SIM_BOOTSTRAP")announce()});refs.clear.onclick=()=>{state.history=[];state.output="";render()};refs.input.addEventListener("keydown",e=>{if(e.key==="Enter"){state.history.push({cwd:state.cwd,command:refs.input.value,output:""});refs.input.value="";render()}});baseline={};reset();announce();setTimeout(announce,80);setTimeout(announce,350)})();
</script><script src="../shared/highlighter.js?v=17"></script><script src="../shared/layout-resize.js?v=6"></script></body></html>

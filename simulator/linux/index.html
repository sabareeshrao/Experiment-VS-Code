<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Linux Playback Engine</title>
<style>
:root{
  --bg:#ececec;--surface:#fff;--surface2:#f4f4f4;--text:#222;--muted:#666;--line:#c9c9c9;
  --accent:#e95420;--hover:#efefef;--term:#2c001e;--termText:#f2f2f2;--shadow:rgba(0,0,0,.28);
  --dockW:54px;--gap:12px
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Ubuntu","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit}
body.theme-dark{--bg:#111418;--surface:#1b1f24;--surface2:#15191e;--text:#ecf0f3;--muted:#9ca5ad;--line:#39414a;--hover:#242b32;--term:#17131a;--termText:#f3f3f3;--shadow:rgba(0,0,0,.55)}
.desktop{height:100%;display:grid;grid-template-rows:30px minmax(0,1fr);position:relative;background:linear-gradient(135deg,#4b1437,#772953 48%,#dd4814 130%)}
.topbar{display:flex;align-items:center;min-width:0;background:rgba(20,20,20,.94);color:#fff;padding:0 10px;font-size:10px;z-index:100}
.activities{font-weight:700}.grow{flex:1}.clock{margin-right:14px}.fidelityIndicators{white-space:nowrap;margin-right:8px}
.workspace{min-height:0;min-width:0;position:relative;overflow:hidden;padding:var(--gap) var(--gap) var(--gap) calc(var(--dockW) + var(--gap) * 2)}
.dock{position:absolute;left:8px;top:10px;bottom:10px;width:var(--dockW);background:rgba(25,25,25,.78);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:7px;display:flex;flex-direction:column;gap:6px;z-index:30;overflow-y:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}.dockBtn{flex:0 0 auto;width:38px;height:38px;border-radius:7px;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:15px;border:1px solid rgba(255,255,255,.12);cursor:pointer}.dockBtn:hover,.dockBtn.active{background:rgba(233,84,32,.52);border-color:rgba(255,255,255,.28)}
.window{position:absolute;left:calc(var(--dockW) + var(--gap) * 2);top:var(--gap);right:var(--gap);bottom:var(--gap);min-width:0;min-height:0;background:var(--surface);border:1px solid #333;border-radius:8px;box-shadow:0 7px 24px var(--shadow);display:none;overflow:hidden;z-index:10}
.window.show{display:grid}.window.maximized{left:var(--gap);z-index:40}.windowHead{height:32px;min-width:0;background:var(--surface2);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 8px 0 10px;font-size:10px;font-weight:700;user-select:none}.windowTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.windowBtns{margin-left:auto;display:flex;gap:4px}.winBtn{width:24px;height:22px;border:0;border-radius:4px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}.winBtn:hover{background:var(--hover);color:var(--text)}
.terminalWin{grid-template-rows:32px minmax(0,1fr) 22px}.terminal{background:var(--term);color:var(--termText);font:11px/17px "Ubuntu Mono",Consolas,monospace;padding:10px;overflow:auto;white-space:pre-wrap;min-width:0;user-select:text;-webkit-user-select:text;scrollbar-width:none}.terminal::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}.terminalHistoryRow,.terminalOutput,.terminalError,.historyCommand,.historyPrompt{user-select:text;-webkit-user-select:text}.promptLine{display:flex;align-items:flex-start;min-width:0}.prompt{color:#8ae234;white-space:pre}.cmdInput{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--termText);font:inherit;line-height:17px;padding:0;margin:0;caret-color:var(--termText);user-select:text;-webkit-user-select:text}.cmdInput::selection,.terminal ::selection{background:#d0d0d0;color:#111}.terminalHint{color:#aaa;font-size:9px;padding-top:3px}.activeProcess{color:#f6c65b}.cursor{display:none}
.filesWin{grid-template-rows:32px 38px minmax(0,1fr)}.fileToolbar{display:flex;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px solid var(--line);background:var(--surface)}.toolbarBtn{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:4px;padding:4px 8px;cursor:pointer}.path{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:5px 7px;font-size:10px;background:var(--surface);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fileBody{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr);min-height:0;min-width:0}.places{border-right:1px solid var(--line);padding:6px;background:var(--surface2);overflow:auto}.place{padding:6px;font-size:10px;border-radius:4px}.place.active{background:var(--hover);font-weight:700}.fileList{overflow:auto;padding:7px;min-width:0}.fileRow{display:grid;grid-template-columns:24px minmax(120px,1fr) 92px 92px 80px;gap:6px;align-items:center;padding:7px;border-bottom:1px solid var(--line);font-size:10px;min-width:560px}.fileRow:hover{background:var(--hover)}.fileRow.active{background:rgba(53,116,240,.12);color:inherit}.fileName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editorWin{grid-template-rows:32px minmax(0,1fr)}.editor{margin:0;padding:10px;background:var(--surface);color:var(--text);font:11px/17px "Ubuntu Mono",Consolas,monospace;white-space:pre;overflow:auto;min-width:0}
.monitorWin{grid-template-rows:32px minmax(0,1fr)}.monitorBody{overflow:auto;min-width:0}.proc{display:grid;grid-template-columns:70px minmax(130px,1fr) 90px 80px 90px;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);font-size:10px;min-width:520px}.proc.head{font-weight:700;background:var(--surface2);position:sticky;top:0;z-index:2}
.serviceWin,.packagesWin,.networkWin,.logsWin,.disksWin{grid-template-rows:32px minmax(0,1fr)}.services,.packages,.network,.logs,.disks{overflow:auto;min-width:0}.serviceRow{display:grid;grid-template-columns:minmax(150px,1fr) 110px 100px;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;min-width:390px}.activeService,.installedPkg,.linkUp,.diskHealthy{color:#3fa34d;font-weight:700}.failedService,.removedPkg,.linkDown,.diskWarning{color:#d9534f;font-weight:700}
.packageRow{display:grid;grid-template-columns:minmax(150px,1.4fr) 110px 105px minmax(120px,1fr);gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;min-width:550px}.packageRow.head,.netRow.head,.diskRow.head{font-weight:700;background:var(--surface2);position:sticky;top:0;z-index:2}
.netSectionTitle,.logSectionTitle{padding:8px 10px;font-size:10px;font-weight:700;background:var(--surface2);border-bottom:1px solid var(--line)}.netRow{display:grid;grid-template-columns:110px 100px minmax(160px,1fr) 120px;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;min-width:500px}.socketRow{display:grid;grid-template-columns:90px minmax(160px,1fr) minmax(160px,1fr) 110px;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;min-width:560px}
.logToolbar{position:sticky;top:0;z-index:3;display:flex;gap:6px;padding:7px;background:var(--surface2);border-bottom:1px solid var(--line)}.logFilter{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:4px;padding:5px 7px;font-size:10px}.logRow{display:grid;grid-template-columns:130px 85px 120px minmax(180px,1fr);gap:7px;padding:7px 10px;border-bottom:1px solid var(--line);font:10px/15px "Ubuntu Mono",Consolas,monospace;min-width:600px}.logWarn{color:#f0ad4e}.logError{color:#d9534f}
.diskRow{display:grid;grid-template-columns:minmax(120px,1fr) 90px 90px 90px 90px minmax(110px,1fr);gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;min-width:620px}
.notification{position:absolute;right:18px;top:18px;max-width:min(360px,60%);background:var(--surface);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;box-shadow:0 4px 14px var(--shadow);padding:10px 12px;font-size:10px;display:none;z-index:70}.notification.show{display:block}
.targetBoundary,.targetBoundary.show{display:none!important}.sim-emphasis{background:rgba(53,116,240,.12)!important;box-shadow:none!important;outline:none!important}.terminalHistoryRow.sim-emphasis,.promptLine.sim-emphasis{display:flex;width:calc(100% + 4px);background:rgba(255,212,0,.06)!important;outline:2px solid #ffd400!important;outline-offset:-1px!important;box-shadow:0 0 10px rgba(255,212,0,.24)!important;border-radius:2px;padding:1px 4px;margin-left:-4px}.terminalHistoryRow.sim-emphasis{display:block}.historyPrompt{color:#8ae234;white-space:pre}.historyCommand{display:inline;width:auto;white-space:pre-wrap}.terminalHistoryRow.sim-emphasis .historyCommand,.promptLine.sim-emphasis .cmdInput,.cmdInput.typed-command-focus{color:#ffd84d!important;font-weight:700!important}.terminalInputRow.sim-emphasis,.terminalPromptRow.sim-emphasis,.cmdInput.sim-emphasis{background:rgba(255,212,0,.06)!important;outline:2px solid #ffd400!important;outline-offset:-1px!important;box-shadow:0 0 10px rgba(255,212,0,.28)!important;border-radius:2px!important}
@media(max-width:760px){:root{--dockW:42px;--gap:6px}.dock{left:3px;top:5px;bottom:5px;padding:5px;width:var(--dockW)}.dockBtn{width:30px;height:32px;font-size:13px}.window{left:calc(var(--dockW) + var(--gap) * 2);top:var(--gap);right:var(--gap);bottom:var(--gap)}.window.maximized{left:var(--gap)}.fileBody{grid-template-columns:96px minmax(0,1fr)}.fileRow{grid-template-columns:22px minmax(120px,1fr) 76px;min-width:320px}.fileRow>*:nth-child(4),.fileRow>*:nth-child(5){display:none}.proc{grid-template-columns:55px minmax(120px,1fr) 70px;min-width:300px}.proc>*:nth-child(4),.proc>*:nth-child(5){display:none}.serviceRow{grid-template-columns:minmax(120px,1fr) 90px;min-width:280px}.serviceRow>*:nth-child(3){display:none}}

.linuxAssistant{position:absolute;right:22px;bottom:28px;width:min(420px,46vw);z-index:500;background:#202124;color:#f1f3f4;border:1px solid #4b4f55;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.58);display:none;overflow:hidden}.linuxAssistant.show{display:block}.linuxAssistant.minimized .assistantBody{display:none}.assistantHead{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#292a2d;border-bottom:1px solid #3c4043;font-size:11px;font-weight:700;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.linuxAssistant.dragging .assistantHead{cursor:grabbing}.linuxAssistant.dragging{will-change:left,top;transition:none!important}.assistantHead .grow{flex:1}.assistantHead button{border:0;background:transparent;color:#ddd;width:26px;height:26px;border-radius:4px;cursor:pointer}.assistantHead button:hover{background:#414850}.assistantBody{padding:12px 14px 14px;font:11px/17px "Segoe UI",Arial,sans-serif;max-height:240px;overflow:auto}.assistantMeta{color:#a8c7fa;font-size:9px;margin-bottom:7px}.terminalStatus{position:static;min-width:0;min-height:22px;display:flex;align-items:center;gap:12px;padding:0 10px;background:var(--surface2);border-top:1px solid var(--line);color:#aaa;font:9px "Segoe UI",Arial,sans-serif;pointer-events:none;overflow:hidden}.terminalStatus>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.terminalStatus .grow{flex:1}.fileToolbar .toolbarBtn.small{padding:4px 7px}.editor[contenteditable="true"]{outline:none}.editor[contenteditable="true"]:focus{box-shadow:inset 0 0 0 1px var(--accent)}
</style>
</head>
<body class="theme-dark" data-sim-app="linux">
<div class="desktop" id="app">
  <div class="topbar"><span class="activities">Activities</span><div class="grow"></div><span class="clock" id="clock">Linux</span><span class="fidelityIndicators" aria-hidden="true">▴ ◉ 🔊</span><span id="user">user</span></div>
  <div class="workspace">
    <div class="dock" aria-label="Applications">
      <button class="dockBtn" id="termDock" title="Terminal">⌨</button>
      <button class="dockBtn" id="filesDock" title="Files">▣</button>
      <button class="dockBtn" id="monitorDock" title="System Monitor">▥</button>
      <button class="dockBtn" id="servicesDock" title="Services">⚙</button>
      <button class="dockBtn" id="packagesDock" title="Packages">▦</button>
      <button class="dockBtn" id="networkDock" title="Network">◎</button>
      <button class="dockBtn" id="logsDock" title="Logs">≡</button>
      <button class="dockBtn" id="disksDock" title="Disks">◫</button>
    </div>

    <div class="window terminalWin" id="terminalWin"><div class="windowHead"><span class="windowTitle">Terminal</span><div class="windowBtns"><button class="winBtn" data-action="minimize">—</button><button class="winBtn" data-action="maximize">□</button><button class="winBtn" data-action="close">×</button></div></div><div class="terminal" id="terminal"></div><div class="terminalStatus"><span id="cwdStatus"></span><span id="exitStatus">exit 0</span><div class="grow"></div><span id="processStatus">Ready</span></div></div>

    <div class="window filesWin" id="filesWin"><div class="windowHead"><span class="windowTitle">Files</span><div class="windowBtns"><button class="winBtn" data-action="minimize">—</button><button class="winBtn" data-action="maximize">□</button><button class="winBtn" data-action="close">×</button></div></div><div class="fileToolbar"><button class="toolbarBtn" id="backFile">←</button><button class="toolbarBtn small" id="newFolderBtn" title="New Folder">＋ Folder</button><button class="toolbarBtn small" id="newFileBtn" title="New File">＋ File</button><div class="path" id="path"></div></div><div class="fileBody"><div class="places"><div class="place active">Home</div><div class="place">Desktop</div><div class="place">Documents</div><div class="place">Downloads</div><div class="place">File System</div></div><div class="fileList" id="fileList"></div></div></div>

    <div class="window editorWin" id="editorWin"><div class="windowHead"><span class="windowTitle" id="editorTitle">Text Editor</span><div class="windowBtns"><button class="winBtn" data-action="minimize">—</button><button class="winBtn" data-action="maximize">□</button><button class="winBtn" data-action="close">×</button></div></div><pre class="editor" id="editor" contenteditable="true" spellcheck="false"></pre></div>

    <div class="window monitorWin" id="monitorWin"><div class="windowHead"><span class="windowTitle">System Monitor</span><div class="windowBtns"><button class="winBtn" data-action="minimize">—</button><button class="winBtn" data-action="maximize">□</button><button class="winBtn" data-action="close">×</button></div></div><div class="monitorBody" id="processes"></div></div>

    <div class="window serviceWin" id="serviceWin"><div class="windowHead"><span class="windowTitle">Services</span><div class="windowBtns"><button class="winBtn" data-action="minimize">—</button><button class="winBtn" data-action="maximize">□</button><button class="winBtn" data-action="close">×</button></div></div><div class="services" id="services"></div></div>

    <div class="window packagesWin" id="packagesWin"><div class="windowHead"><span class="windowTitle">Packages</span><div class="windowBtns"><button class="winBtn" data-action="minimize">—</button><button class="winBtn" data-action="maximize">□</button><button class="winBtn" data-action="close">×</button></div></div><div class="packages" id="packages"></div></div>

    <div class="window networkWin" id="networkWin"><div class="windowHead"><span class="windowTitle">Network</span><div class="windowBtns"><button class="winBtn" data-action="minimize">—</button><button class="winBtn" data-action="maximize">□</button><button class="winBtn" data-action="close">×</button></div></div><div class="network" id="network"></div></div>

    <div class="window logsWin" id="logsWin"><div class="windowHead"><span class="windowTitle">System Logs</span><div class="windowBtns"><button class="winBtn" data-action="minimize">—</button><button class="winBtn" data-action="maximize">□</button><button class="winBtn" data-action="close">×</button></div></div><div class="logs"><div class="logToolbar"><input class="logFilter" id="logFilter" value="" placeholder="Filter journal entries" readonly></div><div id="logRows"></div></div></div>

    <div class="window disksWin" id="disksWin"><div class="windowHead"><span class="windowTitle">Disks</span><div class="windowBtns"><button class="winBtn" data-action="minimize">—</button><button class="winBtn" data-action="maximize">□</button><button class="winBtn" data-action="close">×</button></div></div><div class="disks" id="disks"></div></div>


    <div class="linuxAssistant" id="linuxAssistant">
      <div class="assistantHead" id="assistantHead"><span>▰</span><span id="assistantTitle">Current Step</span><div class="grow"></div><button id="assistantMin" title="Minimize">—</button><button id="assistantClose" title="Close">×</button></div>
      <div class="assistantBody"><div class="assistantMeta" id="assistantMeta"></div><div id="assistantText"></div></div>
    </div>
    <div class="notification" id="notification"></div>
  </div>
  <div class="targetBoundary" id="targetBoundary"></div>
</div>
<script src="engine.js?v=8"></script>
<script src="adaptive-ui.js?v=1"></script>\n  <script src="../shared/highlighter.js?v=7"></script>\n  <script src="../shared/explanation-controls.js?v=9"></script>\n  <script src="../shared/layout-resize.js?v=10"></script>
</body>
</html>

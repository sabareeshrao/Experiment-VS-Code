<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="simulation-app" content="github"><meta name="simulation-label" content="GitHub"><title>GitHub Simulator</title><style>
:root{--bg:#0d1117;--surface:#0d1117;--surface2:#161b22;--surface3:#21262d;--line:#30363d;--text:#c9d1d9;--muted:#8b949e;--link:#58a6ff;--green:#238636;--red:#f85149;--orange:#f78166;--purple:#8957e5;--blue:#1f6feb;--shadow:rgba(0,0,0,.5);--sideW:248px}body.theme-light{--bg:#fff;--surface:#fff;--surface2:#f6f8fa;--surface3:#f3f4f6;--line:#d0d7de;--text:#24292f;--muted:#57606a;--link:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--blue:#0969da;--shadow:rgba(31,35,40,.15)}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:64px minmax(0,1fr);position:relative}.top{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface2);border-bottom:1px solid var(--line)}.logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:var(--bg);font-weight:900}.search{width:min(360px,34vw);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px}.topnav{display:flex;gap:16px;font-size:12px}.grow{flex:1}.iconBtn,.btn{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 10px;font-size:12px}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.main{display:grid;grid-template-columns:var(--sideW) 5px minmax(0,1fr);min-height:0}.side{border-right:1px solid var(--line);padding:12px;overflow:auto;background:var(--surface)}.split{cursor:col-resize;background:var(--line);opacity:.45}.split:hover{background:var(--link)}.side h4{margin:8px 6px;font-size:11px}.item{padding:7px 8px;border-radius:6px;font-size:12px}.item:hover,.item.active{background:var(--surface2)}.content{overflow:auto;min-width:0}.repoHead{padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line)}.repoTitle{font-size:18px;color:var(--link)}.badge,.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted)}.repoStats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tabs{display:flex;gap:2px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);overflow:auto}.tab{padding:10px 9px;font-size:12px;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{border-bottom-color:var(--orange);font-weight:600}.view{padding:18px 20px}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.card{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:12px;overflow:hidden}.cardHead{padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:12px}.fileRow,.issueRow,.prRow,.commitRow,.branchRow,.releaseRow,.securityRow{display:grid;grid-template-columns:minmax(200px,1fr) minmax(140px,1fr) 110px;gap:8px;padding:9px 12px;border-bottom:1px solid var(--surface3);font-size:12px}.fileRow:last-child,.issueRow:last-child,.prRow:last-child,.commitRow:last-child,.branchRow:last-child,.releaseRow:last-child,.securityRow:last-child{border-bottom:0}.link{color:var(--link);cursor:pointer}.muted{color:var(--muted)}.code{font:12px/20px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;overflow:auto;padding:12px;background:var(--surface)}.diffAdd{background:rgba(46,160,67,.18);color:#7ee787}.diffDel{background:rgba(248,81,73,.18);color:#ff7b72}.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px}.modalBack{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:40}.modalBack.show{display:grid}.modal{width:min(660px,92vw);max-height:84vh;overflow:auto;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 12px 40px var(--shadow)}.target{position:absolute;display:none;pointer-events:none;border:2px solid #58a6ff;border-radius:4px;box-shadow:0 0 0 2px rgba(88,166,255,.18);z-index:90}.target.show{display:block}.ok{color:#3fb950}.bad{color:#f85149}.warn{color:#d29922}.profile{display:grid;grid-template-columns:220px 1fr;gap:25px}.profilePic{width:180px;height:180px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-size:52px}.contrib{display:grid;grid-template-columns:repeat(26,10px);gap:3px;margin-top:8px}.dot{width:10px;height:10px;background:var(--surface2);border-radius:2px}.dot.on{background:var(--green)}.timeline{border-left:2px solid var(--line);margin-left:12px;padding-left:18px}.event{margin:0 0 14px}.reviewBox{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px}.settingsNav{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px}.settingsMenu .item.active{font-weight:600}.contextMenu{position:fixed;z-index:120;display:none;min-width:235px;padding:4px;background:var(--surface2);border:1px solid var(--line);box-shadow:0 8px 24px var(--shadow)}.contextMenu.show{display:block}.contextItem{position:relative;display:grid;grid-template-columns:1fr auto 12px;gap:10px;align-items:center;padding:5px 8px;min-height:28px;font-size:11px}.contextItem:hover{background:var(--surface3)}.contextSub{display:none;position:absolute;left:calc(100% - 2px);top:-4px;min-width:220px;padding:4px;background:var(--surface2);border:1px solid var(--line);box-shadow:0 8px 22px var(--shadow)}.contextItem.has:hover>.contextSub{display:block}.sep{height:1px;background:var(--line);margin:4px}.productAssistant{position:fixed;right:16px;bottom:38px;width:340px;z-index:150;display:none;background:var(--surface2);border:1px solid var(--line);box-shadow:0 8px 24px var(--shadow);border-radius:6px;overflow:hidden}.productAssistant.show{display:block}.productAssistantHead{height:34px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--surface3);border-bottom:1px solid var(--line);font-size:10px;font-weight:700}.productAssistantHead .grow{flex:1}.productAssistantHead button{border:0;background:transparent;color:inherit;width:24px;height:24px}.productAssistantBody{padding:10px;font-size:10.5px;line-height:1.5;max-height:210px;overflow:auto;user-select:text}@media(max-width:820px){.main{grid-template-columns:200px 4px minmax(0,1fr)}.two,.settingsNav{grid-template-columns:1fr}.topnav{display:none}.side{padding:8px}}
</style></head><body class="theme-dark" data-sim-app="github"><div class="app" id="app"><header class="top"><div class="logo">GH</div><input id="globalSearch" class="search" placeholder="Type / to search"><div class="topnav"><span>Pull requests</span><span>Issues</span><span>Codespaces</span><span>Marketplace</span></div><div class="grow"></div><button class="iconBtn" id="themeBtn">◐</button><span>＋</span><span>◉</span><div id="avatar">U</div></header><div class="main"><aside class="side"><h4>Repositories</h4><div id="repoList"></div><h4>Navigation</h4><div class="item" data-side="profile">Your profile</div><div class="item" data-side="repos">Your repositories</div><div class="item" data-side="stars">Stars</div></aside><div class="split" id="sideSplit"></div><main class="content" id="content"></main></div><div class="modalBack" id="modalBack"><div class="modal" id="modal"></div></div><div class="target" id="target"></div><div class="contextMenu" id="contextMenu"></div><aside class="productAssistant" data-sim-explanation id="assistant"><div class="productAssistantHead" data-sim-explanation-drag><strong>GitHub</strong><span class="grow"></span><button id="assistantMin" title="Minimize">−</button><button id="assistantClose" title="Close">×</button></div><div class="productAssistantBody" data-sim-explanation-body><div data-sim-explanation-text id="assistantText"></div></div></aside></div><script src="capabilities.js?v=1"></script><script src="engine.js?v=2"></script></body></html>

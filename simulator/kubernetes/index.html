<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kubernetes — Headlamp</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--panel2:#f2f4f8;--line:#dfe3ea;--text:#172033;--muted:#677286;--blue:#326ce5;--blue2:#eaf1ff;--green:#198754;--amber:#d98a00;--red:#d33f49;--shadow:0 6px 24px rgba(27,39,66,.10);--terminal:#0d1117;--terminalText:#d6e1ef}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}
body.dark{--bg:#111827;--panel:#182132;--panel2:#202b3d;--line:#334155;--text:#edf2f7;--muted:#9ca9bb;--blue2:#1c315d;--shadow:0 6px 24px #0006}
#app{height:100vh;display:grid;grid-template-rows:56px minmax(0,1fr) 24px}
.topbar{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 4px #00000008;z-index:10}.brand{display:flex;align-items:center;gap:8px;font-weight:700;min-width:210px}.brand svg{display:block}.topSelect{height:34px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:5px;padding:0 30px 0 10px;min-width:160px}.topSearch{margin-left:auto;width:min(420px,35vw);height:34px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:0 10px}.topSearch input{border:0;background:transparent;outline:0;width:100%;color:var(--text)}.iconBtn{width:34px;height:34px;border:1px solid transparent;background:transparent;border-radius:6px;display:grid;place-items:center;color:var(--text)}.iconBtn:hover{background:var(--panel2);border-color:var(--line)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:0}.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:8px}.sideGroup{margin:8px 0 13px}.sideLabel{padding:5px 9px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}.sideItem{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--text);padding:7px 9px;border-radius:6px;text-align:left;font-size:12px;cursor:pointer}.sideItem:hover{background:var(--panel2)}.sideItem.active{background:var(--blue2);color:var(--blue);font-weight:600}.sideItem svg{flex:none}.count{margin-left:auto;color:var(--muted);font-size:10px}
.content{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);position:relative}.crumbbar{height:42px;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}.crumbbar span{font-size:11px;color:var(--muted)}.crumbbar b{font-size:12px}.main{overflow:auto;padding:18px 20px 180px}.pageHead{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}.pageHead h1{margin:0;font-size:22px;font-weight:650}.pageHead p{margin:4px 0 0;color:var(--muted);font-size:11px}.grow{flex:1}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:5px;padding:7px 10px;font-size:11px;cursor:pointer}.btn:hover{background:var(--panel2)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red);border-color:#e4a8ad}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px;box-shadow:0 1px 2px #00000004}.card small{display:block;color:var(--muted);font-size:10px;margin-bottom:8px}.card strong{font-size:24px}.card .sub{font-size:10px;color:var(--muted);margin-top:5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}.panelTitle{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600}.panelBody{padding:12px}.resourceToolbar{display:flex;align-items:center;gap:7px;padding:9px 10px;border-bottom:1px solid var(--line)}.resourceToolbar input{height:30px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:5px;padding:0 9px;min-width:220px}.kTable{width:100%;border-collapse:collapse;font-size:11px}.kTable th,.kTable td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.kTable th{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--panel2)}.kTable tbody tr{cursor:pointer}.kTable tbody tr:hover{background:var(--panel2)}.nameCell{font-weight:600;color:var(--blue)}.status{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 7px;font-size:9px;font-weight:600}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.ok{background:#e8f6ee;color:var(--green)}.status.warn{background:#fff5dd;color:var(--amber)}.status.bad{background:#fdebec;color:var(--red)}.status.info{background:var(--blue2);color:var(--blue)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:12px}.tab{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;font-size:11px}.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}.detailGrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:14px}.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:11px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{padding:3px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font:9px ui-monospace,SFMono-Regular,Consolas,monospace}
.yamlEditor,.logViewer,.execViewer{width:100%;min-height:360px;background:#111827;color:#d6e1ef;border:1px solid #293548;border-radius:6px;padding:12px;font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;overflow:auto}.yamlEditor{resize:vertical;outline:0}.logToolbar{display:flex;align-items:center;gap:7px;margin-bottom:8px}.logToolbar input{height:30px;border:1px solid var(--line);border-radius:5px;padding:0 8px;background:var(--panel);color:var(--text)}
.terminalDock{position:absolute;left:12px;right:12px;bottom:12px;height:152px;background:var(--terminal);border:1px solid #293548;border-radius:8px;box-shadow:var(--shadow);z-index:7;display:none;grid-template-rows:32px minmax(0,1fr) 31px;overflow:hidden}.terminalDock.show{display:grid}.terminalHead{display:flex;align-items:center;gap:8px;padding:0 10px;background:#161b22;color:#cbd5e1;font-size:10px;border-bottom:1px solid #293548}.terminalBody{overflow:auto;padding:8px 10px;color:var(--terminalText);font:10.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;user-select:text;white-space:pre-wrap}.terminalLine{margin:0 0 2px}.prompt{color:#70c0ff}.termInputRow{display:flex;align-items:center;gap:6px;padding:4px 9px;border-top:1px solid #293548;color:var(--terminalText);font:10.5px ui-monospace,SFMono-Regular,Consolas,monospace}.termInput{flex:1;border:0;background:transparent;color:#fff;outline:0;font:inherit}.termClose{margin-left:auto;border:0;background:transparent;color:#cbd5e1}
.mapCanvas{position:relative;height:500px;background:radial-gradient(circle at 1px 1px,#cfd7e6 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.mapNode{position:absolute;width:160px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:6px;padding:9px;box-shadow:var(--shadow);font-size:10px}.mapNode b{display:block;margin-bottom:5px}.mapNode small{color:var(--muted)}.mapEdge{position:absolute;height:2px;background:#93a3bb;transform-origin:left center}.projectGrid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:12px}.projectCard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}.projectCard h3{margin:0 0 6px;font-size:14px}.projectCard p{font-size:10px;color:var(--muted)}.projectStats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.projectStats div{background:var(--panel2);border-radius:5px;padding:7px;text-align:center}.projectStats b{display:block;font-size:14px}.projectStats small{font-size:8px;color:var(--muted)}
.metricBars{display:grid;gap:10px}.metricRow{display:grid;grid-template-columns:180px 1fr 80px;gap:10px;align-items:center;font-size:10px}.bar{height:8px;background:var(--panel2);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:inherit}.eventWarn{color:var(--amber)}.eventBad{color:var(--red)}
.modalShade{position:absolute;inset:0;background:#11182755;display:none;place-items:center;z-index:20}.modalShade.show{display:grid}.modal{width:min(760px,90%);max-height:80%;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);display:grid;grid-template-rows:44px minmax(0,1fr) 50px;overflow:hidden}.modalHead{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);font-weight:600}.modalBody{padding:14px;overflow:auto}.modalFoot{display:flex;justify-content:flex-end;gap:7px;align-items:center;padding:0 12px;border-top:1px solid var(--line)}
.toast{position:absolute;right:18px;top:68px;background:#172033;color:white;border-radius:6px;padding:9px 12px;font-size:10px;box-shadow:var(--shadow);display:none;z-index:30}.toast.show{display:block}
.footer{display:flex;align-items:center;gap:12px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);font-size:9px;color:var(--muted)}
#k8sAssistant{display:none}#k8sAssistant.show{display:block}#k8sAssistant.hidden{display:none}
#k8sAssistant>[data-sim-explanation-drag]{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #485266;font:600 10px/1.3 "Segoe UI",Arial,sans-serif;cursor:grab}
#k8sAssistant>[data-sim-explanation-drag] .grow{flex:1}#k8sAssistant>[data-sim-explanation-drag] button{width:24px;height:22px;border:0;background:transparent;color:inherit;font-size:14px}
#k8sAssistant>[data-sim-explanation-body]{padding:10px 12px;font:11px/1.55 "Segoe UI",Arial,sans-serif;user-select:text}#k8sAssistant>[data-sim-explanation-body] p{margin:0}#k8sAssistant.minimized>[data-sim-explanation-body]{display:none}
@media(max-width:980px){.shell{grid-template-columns:190px minmax(0,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.detailGrid{grid-template-columns:1fr}.topSearch{display:none}}
</style>
</head>
<body data-sim-app="kubernetes">
<div id="app">
  <header class="topbar">
    <div class="brand"><span id="brandIcon"></span><span>Headlamp</span></div>
    <select id="clusterSelect" class="topSelect"></select>
    <select id="namespaceSelect" class="topSelect"></select>
    <label class="topSearch"><span id="searchIcon"></span><input id="globalSearch" placeholder="Search resources"></label>
    <button class="iconBtn" id="terminalToggle" title="kubectl terminal"></button>
    <button class="iconBtn" id="themeToggle" title="Toggle theme"></button>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="content">
      <div class="crumbbar" id="crumbbar"></div>
      <main class="main" id="main"></main>
      <section class="terminalDock" id="terminalDock">
        <div class="terminalHead"><span id="terminalIcon"></span><b>kubectl</b><span id="termContext"></span><button class="termClose" id="termClose">×</button></div>
        <div class="terminalBody" id="terminalBody"></div>
        <div class="termInputRow"><span class="prompt" id="termPrompt"></span><input class="termInput" id="termInput" autocomplete="off" spellcheck="false"></div>
      </section>
      <div class="modalShade" id="modalShade"><div class="modal"><div class="modalHead" id="modalHead"></div><div class="modalBody" id="modalBody"></div><div class="modalFoot" id="modalFoot"></div></div></div>
      <div class="toast" id="toast"></div>
    </section>
  </div>
  <footer class="footer"><span id="footerCluster"></span><span id="footerNamespace"></span><span class="grow"></span><span id="footerVersion"></span></footer>
</div>
<aside id="k8sAssistant" data-sim-explanation class="hidden">
  <div data-sim-explanation-drag><strong data-sim-explanation-title>Lesson explanation</strong><span class="grow"></span><button type="button" data-sim-explanation-min>−</button><button type="button" data-sim-explanation-close>×</button></div>
  <div data-sim-explanation-body><p data-sim-explanation-text></p></div>
</aside>
<script src="icons.js?v=1"></script>
<script src="capabilities.js?v=1"></script>
<script src="engine.js?v=4"></script>
<script src="../shared/highlighter.js?v=17"></script>
<script src="../shared/explanation-controls.js?v=23"></script>
<script src="../shared/boot-protocol.js?v=1"></script>
<script src="../shared/layout-resize.js?v=6"></script>
</body>
</html>

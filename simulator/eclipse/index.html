<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse IDE Simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif;background:#1e1e1e;color:#ddd;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:30px 38px 1fr 180px 24px;background:#252526}.menu{display:flex;align-items:center;gap:18px;padding:0 12px;background:#303030;border-bottom:1px solid #111;font-size:12px}.menu b{color:#fff}.toolbar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#2b2b2b;border-bottom:1px solid #111}
button{background:#3b3b3b;color:#ddd;border:1px solid #555;border-radius:3px;padding:5px 9px;font-size:12px}.run{background:#245f32}.main{display:grid;grid-template-columns:260px 1fr;min-height:0}
.side{border-right:1px solid #111;background:#242424;overflow:auto}.pane-title{padding:7px 10px;background:#333;border-bottom:1px solid #111;font-size:12px;font-weight:600}
#projectTree{font:12px Consolas,monospace;padding:8px;line-height:1.75}.tree-file{display:block;border:0;background:transparent;padding:2px 4px;text-align:left;width:100%;color:#d7d7d7}.tree-file:hover{background:#37373d}.editor{display:grid;grid-template-rows:30px 1fr;min-width:0}.tabs{display:flex;background:#252526;border-bottom:1px solid #111}.tab{padding:7px 14px;background:#2d2d2d;border-right:1px solid #111;font-size:12px}.tab.active{background:#1e1e1e;border-top:2px solid #4c9aff;padding-top:5px}
pre{margin:0;padding:16px;white-space:pre-wrap;overflow:auto;font:13px/1.55 Consolas,monospace;color:#dcdcdc}.bottom{border-top:1px solid #111;background:#1e1e1e;display:grid;grid-template-rows:30px 1fr}.bottom-tabs{display:flex;background:#2a2a2a}.bottom-tabs button{border:0;border-radius:0;background:transparent}.bottom-tabs button.active{border-bottom:2px solid #4c9aff}.console{padding:10px;overflow:auto;font:12px/1.5 Consolas,monospace;white-space:pre-wrap}.status{padding:4px 10px;background:#007acc;color:#fff;font-size:11px}.dialog{position:absolute;inset:90px 18% auto;background:#2d2d30;border:1px solid #666;box-shadow:0 12px 40px #0008;padding:18px;display:none;z-index:5}.dialog.show{display:block}
</style></head><body>
<div id="app"><div class="menu"><b>Eclipse IDE</b><span>File</span><span>Edit</span><span>Source</span><span>Navigate</span><span>Search</span><span>Project</span><span>Run</span><span>Window</span><span>Help</span></div>
<div class="toolbar"><button id="newBtn">＋ New</button><button>Save</button><button id="runBtn" class="run">▶ Run</button><span style="margin-left:auto;font-size:11px;color:#aaa">Java perspective</span></div>
<div class="main"><aside class="side"><div class="pane-title">Project Explorer</div><div id="projectTree"></div></aside><section class="editor"><div id="editorTabs" class="tabs"></div><pre id="editor">// Select a Java file from Project Explorer</pre></section></div>
<div class="bottom"><div class="bottom-tabs"><button id="consoleTab" class="active">Console</button><button id="problemsTab">Problems</button></div><div id="console" class="console">No consoles to display at this time.</div></div><div class="status"><span id="statusText">Ready</span></div></div><div id="dialog" class="dialog"></div>
<script>
(()=>{"use strict";const APP_ID="eclipse";const SUPPORTED_ACTIONS=["openProject","createPackage","createJavaFile","openFile","setFileContent","appendFileContent","runApplication","showConsole","showProblems","showBytecode","showDialog","selectProject","highlightTarget"];const $=id=>document.getElementById(id),refs={tree:$("projectTree"),tabs:$("editorTabs"),editor:$("editor"),console:$("console"),consoleTab:$("consoleTab"),problemsTab:$("problemsTab"),dialog:$("dialog"),status:$("statusText")};let baseline=null,state=null,seekToken=0;const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));function defaults(){return{workspace:"Java-Experience",project:"geospatial-operations-tracker",files:{},openFile:"",console:"No consoles to display at this time.",problems:"No problems detected."}}function normalize(v){const x=Object.assign(defaults(),clone(v||{}));x.files=x.files||{};return x}function renderTree(){const paths=Object.keys(state.files).sort();refs.tree.innerHTML='<div>▾ '+state.project+'</div>'+paths.map(p=>'<button class="tree-file" data-path="'+p.replace(/"/g,"&quot;")+'">  '+(p.endsWith(".java")?"☕ ":"▸ ")+p+'</button>').join("");refs.tree.querySelectorAll("[data-path]").forEach(b=>b.onclick=()=>{state.openFile=b.dataset.path;render()})}function render(){renderTree();const p=state.openFile||Object.keys(state.files)[0]||"";if(p)state.openFile=p;refs.tabs.innerHTML=p?'<div class="tab active">'+p.split("/").pop()+'</div>':"";refs.editor.textContent=p?(state.files[p]??""):"// Select a Java file from Project Explorer";refs.status.textContent=state.project+" — Java";refs.dialog.classList.remove("show")}function showBottom(kind,text){refs.consoleTab.classList.toggle("active",kind==="console");refs.problemsTab.classList.toggle("active",kind==="problems");refs.console.textContent=text||""}function apply(st){const a=st?.action,d=st?.data||{};switch(a){case"openProject":case"selectProject":if(d.project)state.project=d.project;render();break;case"createPackage":refs.status.textContent="Created package "+(d.name||d.package||"");break;case"createJavaFile":{const p=d.path||d.file||("src/"+(d.name||"NewClass.java"));state.files[p]=d.content||state.files[p]||"";state.openFile=p;render();break}case"openFile":state.openFile=d.path||d.file||state.openFile;render();break;case"setFileContent":{const p=d.path||state.openFile;if(p){state.files[p]=d.content||"";state.openFile=p;render()}break}case"appendFileContent":{const p=d.path||state.openFile;if(p){state.files[p]=(state.files[p]||"")+(d.content||"");state.openFile=p;render()}break}case"runApplication":showBottom("console",d.output||"Application started successfully.");break;case"showConsole":showBottom("console",d.output||state.console||"");break;case"showProblems":showBottom("problems",d.output||d.message||state.problems);break;case"showBytecode":showBottom("console",d.output||"Compiled from Java source\nmajor version: 52");break;case"showDialog":refs.dialog.innerHTML='<b>'+(d.title||"Eclipse")+'</b><pre>'+(d.message||"")+'</pre>';refs.dialog.classList.add("show");break;}}function reset(){state=normalize(baseline);render();showBottom("console",state.console)}function announce(){parent.postMessage({type:"ENGINE_READY",app:APP_ID,actions:SUPPORTED_ACTIONS},"*")}addEventListener("message",e=>{const m=e.data||{};if(m.type==="SIM_PACKAGE"){baseline=clone(m.package?.apps?.eclipse||{});reset();return}if(m.type==="SIM_SEEK"){const t=++seekToken;reset();for(const st of m.steps||[]){if(t!==seekToken)return;apply(st)}parent.postMessage({type:"SIM_SEEK_DONE",app:APP_ID},"*");return}if(m.type==="SIM_PING"||m.type==="SIM_BOOTSTRAP")announce()});refs.consoleTab.onclick=()=>showBottom("console",state?.console||refs.console.textContent);refs.problemsTab.onclick=()=>showBottom("problems",state?.problems||"No problems detected.");baseline={};reset();announce();setTimeout(announce,80);setTimeout(announce,350)})();
</script><script src="../shared/layout-resize.js?v=6"></script></body></html>
